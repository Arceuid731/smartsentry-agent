# Configuration OpenTelemetry pour SmartSentry Agent sur Linux
# Version ENRICHIE avec filtres précis et inventaire matériel détaillé

receivers:
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu:
        metrics:
          system.cpu.time:
            enabled: true
          system.cpu.utilization:
            enabled: true
      memory:
        metrics:
          system.memory.usage:
            enabled: true
          system.memory.utilization:
            enabled: true
      disk: {}
      filesystem:
        # Filtre pour ne garder que les FS pertinents (évite tmpfs, squashfs, etc.)
        include_fs_types:
          match_type: strict
          fs_types: [ "ext4", "xfs", "btrfs", "zfs" ]
      network:
        # Inclut toutes les interfaces physiques (adapter selon infra)
        include:
          match_type: regexp
          interfaces: [ "^(eth|enp|ens|eno|wlan|bond|br|docker).*" ]
      load: {}
      paging: {}
      process:
        # Collecte fine par process (nécessite droits sur /proc)
        resource_attributes:
          process.owner:
            enabled: true
        metrics:
          process.memory.usage:
            enabled: true
          process.disk.io:
            enabled: true
        mute_process_name_error: true
        mute_process_exe_error: true
        mute_process_io_error: true
      processes: {}
      # Scraper TCP connections (si supporté par ta version OTel)
      # tcp_connections: {}

processors:
  # Étape 1: Détecte automatiquement les attributs de l'hôte et environnement
  resourcedetection:
    detectors: [system, env]
    override: true

  # Étape 2: Enrichissement complet des attributs de ressource
  resource:
    attributes:
      - key: service.name
        value: "smartsentry.agent.linux"
        action: insert
      - key: service.instance.id
        from_attribute: "host.name"
        action: insert
      # Enrichissement inventaire matériel
      - key: host.name
        from_attribute: "host.name"
        action: upsert
      - key: host.id
        from_attribute: "host.id"
        action: upsert
      - key: host.arch
        from_attribute: "host.arch"
        action: upsert
      - key: os.type
        from_attribute: "os.type"
        action: upsert
      - key: os.version
        from_attribute: "os.version"
        action: upsert
      - key: host.cpu.logical.count
        from_attribute: "host.cpu.logical.count"
        action: upsert
      - key: host.cpu.physical.count
        from_attribute: "host.cpu.physical.count"
        action: upsert
      # Ajoute d'autres attributs d'inventaire si exposés par OTel

  # Étape 3: Regroupe en lots
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlphttp:
    endpoint: http://192.168.1.211:4318
    tls:
      insecure: true

  # Exportateur de debug pour validation
  debug:
    verbosity: detailed

service:
  # Configuration des logs pour le débogage
  telemetry:
    logs:
      level: info
      development: false
      sampling:
        initial: 5
        thereafter: 200
      output_paths:
        - /var/log/smartsentry-agent/collector.log
      error_output_paths:
        - /var/log/smartsentry-agent/collector-error.log
      encoding: json
      
  # Pipeline enrichi avec détection avancée et inventaire
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resourcedetection, resource, batch]
      exporters: [otlphttp, debug]