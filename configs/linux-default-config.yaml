# Configuration OpenTelemetry pour SmartSentry Agent sur Linux
# Version DÉFINITIVE avec enrichissement et debug corrects

receivers:
  hostmetrics:
    collection_interval: 15s
    scrapers:
      cpu: {}
      memory: {}
      disk: {}
      network: {}
      filesystem: {}
      load: {}
      paging: {}
      process: {}
      processes: {}

processors:
  # Étape 1: Détecte automatiquement les attributs de l'hôte
  resourcedetection:
    detectors: [system]
    override: true

  # Étape 2: Ajoute et copie des attributs de ressource de manière fiable
  resource:
    attributes:
      - key: service.name
        value: "smartsentry.agent.linux"
        action: insert
      - key: service.instance.id
        from_attribute: "host.name"
        action: insert

  # Étape 3: Regroupe en lots
  batch:
    timeout: 10s
    send_batch_size: 1024

exporters:
  otlphttp:
    endpoint: http://192.168.1.211:4318
    tls:
      insecure: true

  # L'exportateur de DEBUG CORRECT avec la bonne verbosité
  debug:
    verbosity: detailed # "detailed" est essentiel pour voir les attributs

service:
  # Le pipeline qui applique ENFIN les processeurs correctement
  pipelines:
    metrics:
      receivers: [hostmetrics]
      processors: [resourcedetection, resource, batch]
      exporters: [otlphttp, debug] # On active le debug pour valider